[DEFAULT]
UpdateInterval = 1
SignOfLifeLog = 1
Deviceinstance = 43
Position = 0
IP = 192.168.2.31

# Protocol used to communicate with the WARP charger: http (default) or https.
# Set this to https if the WARP web interface connection mode is set to
# "secure (HTTPS) only" (Network -> Settings -> Connection mode). Otherwise the
# charger replies with a non-JSON "HTTP disabled; use HTTPS instead" message and
# the driver fails to start.
Protocol = http

# Verify the TLS certificate when Protocol = https. The WARP ships with a
# self-signed certificate, so this defaults to false. Set it to true only if you
# have installed a certificate on the WARP that can be verified.
VerifyTLS = false
